<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandCoach Mobile V1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f5f7;color:#222}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 14px;display:flex;gap:8px;align-items:center}
h1{font-size:20px;margin:0;flex:1}
button{border:0;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}
.primary{background:#333;color:#fff}
.secondary{background:#e9eaed}
main{padding:12px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.card h2{font-size:18px;margin:0 0 8px}
.meta{font-size:13px;color:#666;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit}
textarea{min-height:100px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab.active{background:#333;color:#fff}
.list button{width:100%;text-align:left;background:#fff;border:1px solid #ddd;margin-bottom:7px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:100}
pre{white-space:pre-wrap}
.small{font-size:12px;color:#666}
.readonly-note{background:#fff8d9;border:1px solid #eadb88;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>

<header>
  <h1>🤾 HandCoach</h1>
  <button id="loginBtn" class="primary" onclick="toggleAuth()">Connexion</button>
</header>

<main>
  <div id="authBox" class="card hidden">
    <h2>Connexion</h2>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email">
    <label>Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="login()">Se connecter</button>
      <button class="secondary" onclick="logout()">Se déconnecter</button>
    </div>
    <div class="small" id="authStatus"></div>
  </div>

  <div id="app" class="hidden">
    <div class="readonly-note" id="modeNote"></div>

    <div class="tabs">
      <button id="tabExercises" class="tab active" onclick="showTab('exercises')">📚 Exercices</button>
      <button id="tabSessions" class="tab" onclick="showTab('sessions')">📅 Séances</button>
    </div>

    <div id="exercisesPanel">
      <div class="card">
        <input id="exerciseSearch" placeholder="Rechercher un exercice…" oninput="renderExercises()">
      </div>
      <div id="exerciseList" class="list"></div>
    </div>

    <div id="sessionsPanel" class="hidden">
      <div class="card">
        <input id="sessionSearch" placeholder="Rechercher une séance…" oninput="renderSessions()">
      </div>
      <div id="sessionList" class="list"></div>
    </div>

    <div id="detail" class="card hidden"></div>
  </div>
</main>

<div id="toast"></div>

<script>
/* =========================================================
   CONFIGURATION MOBILE
========================================================= */

// false = lecture seule
// true  = active les fonctions d'écriture disponibles
const MOBILE_EDIT_MODE = false;

const SUPABASE_URL = '';
const SUPABASE_KEY = '';

if (!SUPABASE_URL || !SUPABASE_KEY) {
  console.warn("⚠️ Identifiants Supabase absents du fichier source.");
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let exercises = [];
let sessions = [];
let currentTab = "exercises";

const TEAM_ID = "2e6d9541-dbd1-4c23-bb14-81cce7d65fd6";

/* =========================================================
   UTILITAIRES
========================================================= */

function showToast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.style.display = "none", 2500);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function toggleAuth() {
  document.getElementById("authBox").classList.toggle("hidden");
}

function showTab(tab) {
  currentTab = tab;
  document.getElementById("exercisesPanel").classList.toggle("hidden", tab !== "exercises");
  document.getElementById("sessionsPanel").classList.toggle("hidden", tab !== "sessions");
  document.getElementById("tabExercises").classList.toggle("active", tab === "exercises");
  document.getElementById("tabSessions").classList.toggle("active", tab === "sessions");
  document.getElementById("detail").classList.add("hidden");
}

/* =========================================================
   AUTH
========================================================= */

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById("authStatus").textContent = "❌ " + error.message;
    return;
  }
  currentUser = data.user;
  await initApp();
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null;
  exercises = [];
  sessions = [];
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginBtn").textContent = "Connexion";
  showToast("Déconnecté");
}

sb.auth.onAuthStateChange(async (_event, session) => {
  currentUser = session?.user ?? null;
  if (currentUser) await initApp();
});

/* =========================================================
   CHARGEMENT SUPABASE
========================================================= */

async function initApp() {
  if (!currentUser) return;

  document.getElementById("app").classList.remove("hidden");
  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("loginBtn").textContent = "✓ Connecté";
  document.getElementById("modeNote").textContent =
    MOBILE_EDIT_MODE
      ? "✏️ Mode écriture activé. Les droits restent contrôlés par Supabase."
      : "👁️ Mode lecture seule. Pour activer l'écriture, passe MOBILE_EDIT_MODE à true dans le code.";

  await Promise.all([loadExercises(), loadSessions()]);
  renderExercises();
  renderSessions();
}

async function loadExercises() {
  const { data, error } = await sb
    .from("Exercices")
    .select("id,user_id,team_id,title,category,duration,data,updated_at")
    .order("updated_at", { ascending:false });

  if (error) {
    console.error(error);
    showToast("❌ Chargement exercices : " + error.message);
    return;
  }

  exercises = data || [];
}

async function loadSessions() {
  const { data, error } = await sb
    .from("seances")
    .select("id,user_id,team_id,name,category,date,items,updated_at")
    .order("updated_at", { ascending:false });

  if (error) {
    console.error(error);
    showToast("❌ Chargement séances : " + error.message);
    return;
  }

  sessions = data || [];
}

/* =========================================================
   EXERCICES
========================================================= */

function renderExercises() {
  const q = document.getElementById("exerciseSearch").value.toLowerCase().trim();
  const list = document.getElementById("exerciseList");

  const rows = exercises.filter(ex =>
    !q ||
    String(ex.title || "").toLowerCase().includes(q) ||
    String(ex.category || "").toLowerCase().includes(q)
  );

  if (!rows.length) {
    list.innerHTML = '<div class="card">Aucun exercice trouvé.</div>';
    return;
  }

  list.innerHTML = rows.map(ex => `
    <button onclick="openExercise('${esc(ex.id)}')">
      <strong>📄 ${esc(ex.title || "Sans titre")}</strong><br>
      <span class="small">${esc(ex.category || "")} · ${Number(ex.duration) || 15} min
      ${ex.team_id ? " · 🤝 partagé" : ""}</span>
    </button>
  `).join("");
}

function openExercise(id) {
  const ex = exercises.find(x => x.id === id);
  if (!ex) return;

  const d = ex.data || {};
  const detail = document.getElementById("detail");

  detail.innerHTML = `
    <h2>📄 ${esc(ex.title || "Sans titre")}</h2>
    <div class="meta">${esc(ex.category || "")} · ${Number(ex.duration) || 15} min</div>

    ${field("Mise en place", d.setup || d.miseEnPlace)}
    ${field("Consignes", d.instructions || d.consignes)}
    ${field("Variante", d.variant || d.variante)}
    ${field("Objectifs", d.objectives || d.objectifs)}

    ${MOBILE_EDIT_MODE ? `
      <button class="primary" onclick="editExercise('${esc(ex.id)}')">✏️ Modifier</button>
    ` : ""}
  `;

  detail.classList.remove("hidden");
  detail.scrollIntoView({behavior:"smooth"});
}

function field(label, value) {
  if (!value) return "";
  return `<h3>${label}</h3><div>${esc(value).replace(/\\n/g,"<br>")}</div>`;
}

/* =========================================================
   SÉANCES
========================================================= */

function renderSessions() {
  const q = document.getElementById("sessionSearch").value.toLowerCase().trim();
  const list = document.getElementById("sessionList");

  const rows = sessions.filter(se =>
    !q ||
    String(se.name || "").toLowerCase().includes(q) ||
    String(se.category || "").toLowerCase().includes(q)
  );

  if (!rows.length) {
    list.innerHTML = '<div class="card">Aucune séance trouvée.</div>';
    return;
  }

  list.innerHTML = rows.map(se => `
    <button onclick="openSession('${esc(se.id)}')">
      <strong>📅 ${esc(se.name || "Sans nom")}</strong><br>
      <span class="small">${esc(se.date || "")} · ${esc(se.category || "")}
      ${se.team_id ? " · 🤝 partagé" : ""}</span>
    </button>
  `).join("");
}

function openSession(id) {
  const se = sessions.find(x => x.id === id);
  if (!se) return;

  const detail = document.getElementById("detail");
  const items = Array.isArray(se.items) ? se.items : [];

  detail.innerHTML = `
    <h2>📅 ${esc(se.name || "Sans nom")}</h2>
    <div class="meta">${esc(se.date || "")} · ${esc(se.category || "")}</div>

    <h3>Exercices</h3>
    ${items.length
      ? `<ol>${items.map(item => `<li>${esc(item.title || item.name || item.exerciseTitle || item.id || "Exercice")}</li>`).join("")}</ol>`
      : "<div>Aucun exercice dans cette séance.</div>"
    }

    ${MOBILE_EDIT_MODE ? `
      <button class="primary" onclick="editSession('${esc(se.id)}')">✏️ Modifier</button>
    ` : ""}
  `;

  detail.classList.remove("hidden");
  detail.scrollIntoView({behavior:"smooth"});
}

/* =========================================================
   ÉCRITURE
========================================================= */

function requireEditMode() {
  if (!MOBILE_EDIT_MODE) {
    showToast("👁️ Mode lecture seule");
    return false;
  }
  return true;
}

async function editExercise(id) {
  if (!requireEditMode()) return;
  showToast("Édition mobile à compléter selon les champs souhaités.");
}

async function editSession(id) {
  if (!requireEditMode()) return;
  showToast("Édition mobile à compléter selon les champs souhaités.");
}

/* =========================================================
   DÉMARRAGE
========================================================= */

(async function start() {
  const { data } = await sb.auth.getSession();
  currentUser = data.session?.user ?? null;

  if (currentUser) {
    await initApp();
  }
})();
</script>
</body>
</html>
